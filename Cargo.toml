[package]
name = "shelf"
version = "0.1.1"
edition = "2024"
authors = ["Franz Geffke <mail@gofranz.com>"]
repository = "https://github.com/franzos/shelf"
license = "GPL-3.0-only"

[package.metadata.deb]
maintainer = "Franz Geffke <mail@gofranz.com>"
section = "utils"
assets = [
    ["target/release/shelf", "usr/bin/", "755"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/shelf", dest = "/usr/bin/shelf", mode = "755" },
]

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
filetime = "0.2.25"
globset = "0.4.18"
kamadak-exif = "0.6.1"
rayon = "1.10.0"
rusqlite = { version = "0.39.0", features = ["bundled"] }
rusqlite_migration = "2.5.0"
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.11.0"
thiserror = "2.0.18"
toml = "1.1.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
walkdir = "2.5.0"

[dev-dependencies]
assert_cmd = "2.2.2"
assert_fs = "1.1.3"
criterion = "0.8.2"
insta = "1.47.2"
predicates = "3.1.4"
proptest = "1.5.0"
tempfile = "3.27.0"

[[bench]]
name = "hash"
harness = false

[[bench]]
name = "template"
harness = false
